# SLF4J Simple Logger configuration
# https://www.slf4j.org/api/org/slf4j/simple/SimpleLogger.html

# Default log level for all loggers
# org.slf4j.simpleLogger.defaultLogLevel=warn

# Log level for specific packages
org.slf4j.simpleLogger.log.io.undertow=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.keg=warn

# Show date and time in logs
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

# Show thread name
org.slf4j.simpleLogger.showThreadName=true

# Show logger name (abbreviated to save space)
org.slf4j.simpleLogger.showLogName=true
org.slf4j.simpleLogger.showShortLogName=false

# Output to stdout instead of stderr
org.slf4j.simpleLogger.logFile=System.out

# Include level in log output
org.slf4j.simpleLogger.levelInBrackets=true


# Set log level to warning for org.xnio
org.slf4j.simpleLogger.log.org.xnio=warn
